# Builds and publishes the Flame Boss add-on's multi-arch images to GHCR.
# Lives at the ROOT of the distribution repo as .github/workflows/build.yaml.
# (Inert here in the doc repo — GitHub only runs workflows from a repo's root.)
name: Build add-on

on:
  push:
    branches: [main]
    paths:
      - "flameboss/**"
      - ".github/workflows/build.yaml"
  pull_request:
    paths:
      - "flameboss/**"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push images to GHCR
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, amd64, armv7, armhf, i386]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # On PRs we build but don't push (see --test below), so skip login there.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.arch }} add-on
        # Pin to a current release: https://github.com/home-assistant/builder/releases
        uses: home-assistant/builder@2024.08.2
        with:
          args: |
            --${{ matrix.arch }} \
            --target /data/flameboss \
            --addon \
            ${{ github.event_name == 'pull_request' && '--test' || '' }}
